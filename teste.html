<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta id="mv" name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content">
<title>Teste de rolagem — Queijaria</title>
<style>
:root{--fundo:#F5F2E9;--card:#FFFDF8;--tinta:#2B2419;--tinta-mole:#6B5E48;--ouro:#D99A2B;--linha:#E6DFCD}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{font-family:system-ui,sans-serif;color:var(--tinta);background:var(--fundo);overscroll-behavior-y:none}
#app{max-width:520px;margin:0 auto;min-height:100svh;padding-bottom:90px}
.topo{position:sticky;top:0;z-index:20;background:rgba(245,242,233,.86);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--linha);padding:10px 14px}
.topo b{font-size:17px}
.painel{position:fixed;bottom:0;left:0;right:0;z-index:40;background:#111;color:#fff;
  font-family:ui-monospace,monospace;font-size:11px;line-height:1.5;padding:8px 10px;max-height:46vh;overflow:auto}
.painel b{color:var(--ouro)}
.tog{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.tog button{font:inherit;padding:7px 9px;border-radius:7px;border:1px solid #555;background:#222;color:#fff}
.tog button.on{background:var(--ouro);color:#000;border-color:var(--ouro);font-weight:700}
.item{background:var(--card);border:1px solid var(--linha);border-radius:14px;padding:13px 15px;margin:9px 14px;
  box-shadow:0 1px 2px rgba(43,36,25,.06),0 8px 24px rgba(43,36,25,.05)}
.item b{display:block;font-size:15px}
.item span{font-size:12px;color:var(--tinta-mole)}
.aviso{margin:12px 14px;padding:11px 13px;background:#fff6e6;border:1px solid var(--ouro);border-radius:11px;font-size:13px;line-height:1.45}
</style>
</head>
<body>
<div id="app">
  <div class="topo"><b>🧀 Teste de rolagem</b></div>
  <div class="aviso">
    Tenta <b>rolar esta lista até o fim</b>.<br><br>
    Se <b>não rolar</b>, vai tocando um botão de cada vez lá embaixo e tentando rolar de novo.
    Quando começar a rolar, <b>me manda qual botão estava aceso</b> — é esse o culpado.
  </div>
  <div id="lista"></div>
</div>

<div class="painel">
  <div>rolagem: <b id="d1">—</b></div>
  <div>altura: <b id="d2">—</b></div>
  <div>tela: <b id="d3">—</b></div>
  <div>aparelho: <b id="d4">—</b></div>
  <div class="tog">
    <button data-t="dvh">min-height:100dvh</button>
    <button data-t="blur">blur no topo</button>
    <button data-t="ovx">overflow-x:hidden</button>
    <button data-t="osb">overscroll:none</button>
    <button data-t="iw">resizes-content</button>
    <button data-t="fixo">position:fixed</button>
  </div>
</div>

<script>
var lista = document.getElementById("lista"), h = "";
for(var i=1;i<=60;i++) h += '<div class="item"><b>Item '+i+'</b><span>linha de teste para dar altura à página</span></div>';
lista.innerHTML = h;

var maxY = 0, eventos = 0;
function pintar(){
  var y = window.scrollY||document.documentElement.scrollTop||0;
  if(y > maxY) maxY = y;
  document.getElementById("d1").textContent = "y=" + Math.round(y) + " · máximo=" + Math.round(maxY) + " · eventos=" + eventos;
  document.getElementById("d2").textContent = "conteúdo=" + document.documentElement.scrollHeight + "px";
  var vv = window.visualViewport;
  document.getElementById("d3").textContent = "innerHeight=" + window.innerHeight + (vv ? " · visual=" + Math.round(vv.height) : "");
}
window.addEventListener("scroll", function(){ eventos++; pintar(); }, {passive:true});
if(window.visualViewport) window.visualViewport.addEventListener("resize", pintar);
document.getElementById("d4").textContent = navigator.userAgent.slice(0,70);
pintar(); setInterval(pintar, 500);

var est = document.createElement("style");
document.head.appendChild(est);
var on = {};
var regras = {
  dvh:  "#app{min-height:100dvh !important}",
  blur: ".topo{backdrop-filter:none !important;-webkit-backdrop-filter:none !important;background:var(--card) !important}",
  ovx:  "html,body{overflow-x:visible !important}",
  osb:  "body{overscroll-behavior-y:auto !important}",
  fixo: "#app{position:fixed !important;inset:0;overflow-y:auto}"
};
document.querySelectorAll(".tog button").forEach(function(b){
  b.onclick = function(){
    var k = b.dataset.t;
    on[k] = !on[k];
    b.classList.toggle("on", on[k]);
    if(k === "iw"){
      document.getElementById("mv").setAttribute("content",
        "width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=" + (on[k] ? "resizes-content" : "overlays-content"));
    }
    var css = "";
    for(var x in on) if(on[x] && regras[x]) css += regras[x] + "\n";
    est.textContent = css;
    maxY = 0; eventos = 0; pintar();
  };
});
</script>
</body>
</html>
